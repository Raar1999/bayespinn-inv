# Base configuration for BayesPINN-Inv training.
# Override fields from the CLI: python scripts/train.py +experiment=large
defaults:
  - _self_

seed: 0
device: cpu          # "cuda" for GPU
dtype: float32       # float64 also supported

material:
  name: Si           # Si or GaAs
  T: 300.0           # K

domain_si:           # device extent in metres
  - 0.0
  - 1.0e-6

# Network architecture
network:
  in_dim: 2
  hidden_dim: 96
  num_blocks: 6
  fourier_features: 32
  fourier_sigma: 2.0
  dropout: 0.0
  doping_dim: 32
  output_dim: 3

# Dataset (synthetic profiles)
dataset:
  n_per_family:
    step: 16
    graded: 16
    ldd: 8
    defect: 8
  n_points: 128         # dense profile resolution
  bias_range:
    - 0.0
    - 0.7

# Training
training:
  lr: 1.0e-3
  n_epochs: 50000
  batch_size: 512
  optimizer: adam
  grad_clip: 1.0
  curriculum_epochs: 15000
  bias_min: 0.0
  bias_max: 0.7
  use_ntk_weights: true
  adaptive_weight_every: 200
  ntk_alpha: 0.9
  log_every: 200
  ckpt_every: 5000

# Output
out_dir: ./outputs/${now:%Y-%m-%d_%H-%M-%S}

# Ensembles (read by the launcher to schedule M runs)
ensemble:
  M: 5                    # number of members
  member_seeds: null      # if null, derived from base seed
