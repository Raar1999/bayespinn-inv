# Quick training config for smoke tests / CI.
# Run with: python scripts/train.py --config-path ../configs --config-name train_smoke
defaults:
  - _self_

seed: 0
device: cpu
dtype: float32

material:
  name: Si
  T: 300.0

domain_si:
  - 0.0
  - 1.0e-6

network:
  in_dim: 2
  hidden_dim: 32
  num_blocks: 3
  fourier_features: 8
  fourier_sigma: 2.0
  dropout: 0.0
  doping_dim: 16
  output_dim: 3

dataset:
  n_per_family:
    step: 2
  n_points: 64
  bias_range:
    - 0.0
    - 0.3

training:
  lr: 1.0e-3
  n_epochs: 200
  batch_size: 64
  optimizer: adam
  grad_clip: 1.0
  curriculum_epochs: 100
  bias_min: 0.0
  bias_max: 0.3
  use_ntk_weights: false
  adaptive_weight_every: 50
  ntk_alpha: 0.9
  log_every: 50
  ckpt_every: 100000     # don't checkpoint in smoke runs

out_dir: ./outputs/smoke

ensemble:
  M: 1
  member_seeds: null
