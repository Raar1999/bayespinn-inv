[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayespinn-inv"
version = "0.1.0"
description = "Bayesian Physics-Informed Neural Networks for Uncertainty-Aware Inverse Design of Semiconductor Devices"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Raar1999", email = "Raar1999@users.noreply.github.com" },
]
requires-python = ">=3.9"
keywords = [
    "physics-informed neural networks",
    "PINN",
    "semiconductor devices",
    "drift-diffusion",
    "uncertainty quantification",
    "Bayesian deep learning",
    "inverse design",
    "active learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.22",
    "scipy>=1.10",
    "torch>=2.0",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
hydra = [
    "hydra-core>=1.3",
    "omegaconf>=2.3",
]
sklearn = [
    "scikit-learn>=1.3",       # isotonic calibration + GP for UCB acquisition
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=23.7",
    "ruff>=0.1",
    "mypy>=1.5",
]
all = [
    "bayespinn-inv[hydra,sklearn,dev]",
]

[project.urls]
"Source" = "https://github.com/Raar1999/bayespinn-inv"
"Issues" = "https://github.com/Raar1999/bayespinn-inv/issues"

[project.scripts]
bayespinn-train   = "bayespinn_inv.scripts.train:main"
bayespinn-inverse = "bayespinn_inv.scripts.inverse_design:main"
bayespinn-al      = "bayespinn_inv.scripts.active_learning:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bayespinn_inv" = ["py.typed"]

# -----------------------------------------------------------------------------
# Test / lint / format
# -----------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "slow: integration tests that train networks (excluded from `make test`)",
]

[tool.coverage.run]
source = ["src/bayespinn_inv"]
omit = ["*/tests/*"]

[tool.ruff]
line-length = 96
target-version = "py39"
select = ["E", "F", "W", "I", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.black]
line-length = 96
target-version = ["py39"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
