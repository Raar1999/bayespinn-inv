[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayespinn-inv"
dynamic = ["version"]
description = "Bayesian Physics-Informed Neural Networks for Uncertainty-Aware Inverse Design of Semiconductor Devices"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Raar1999", email = "Raar1999@users.noreply.github.com" },
]
# AUDIT_g7 SPEC-g0-3b-local. This floor is 3.11 because 3.11 is the only
# interpreter the suite has ever executed on. 3.9, 3.10 and 3.12 were declared
# for six generations and never ran anywhere: the CI matrix that was said to
# evidence them has never executed (CI-01), and no 3.9 or 3.12 interpreter is
# obtainable on the development host (SK-09 forbids the network access that
# fetching one needs). An unexecuted support claim in packaging metadata is the
# S-4 pattern -- an advertised surface nobody has run -- so it is withdrawn
# rather than carried forward on the assumption that CI will eventually settle
# it. See docs/gen/DECISIONS.md DEC-g7-2 for the reversal.
requires-python = ">=3.11"
keywords = [
    "physics-informed neural networks",
    "PINN",
    "semiconductor devices",
    "drift-diffusion",
    "uncertainty quantification",
    "Bayesian deep learning",
    "inverse design",
    "active learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    # Only versions the suite has actually run on are listed. Restoring 3.9,
    # 3.10 or 3.12 requires a retrievable green run log for that leg, not an
    # argument that it ought to work.
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.22",
    "scipy>=1.10",
    "torch>=2.0",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
hydra = [
    "hydra-core>=1.3",
    "omegaconf>=2.3",
]
sklearn = [
    "scikit-learn>=1.3",       # isotonic calibration + GP for UCB acquisition
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=23.7",
    "ruff>=0.1",
    "mypy>=1.5",
]
all = [
    "bayespinn-inv[hydra,sklearn,dev]",
]

[project.urls]
"Source" = "https://github.com/Raar1999/bayespinn-inv"
"Issues" = "https://github.com/Raar1999/bayespinn-inv/issues"

[project.scripts]
# NOTE (AUDIT_MASTER PKG-01): the previous entries pointed at
# bayespinn_inv.scripts.{train,inverse_design,active_learning}, a package that
# does not exist -- those launchers live in the repo-level scripts/ directory,
# which is not part of the wheel, so every console script failed on a clean
# install. The experiment launchers stay repo tools (they need configs/*.yaml);
# the installed package exposes what the library can do standalone.
bayespinn = "bayespinn_inv.cli:main"

[tool.setuptools.dynamic]
# Single source of truth for the version: bayespinn_inv.__version__.
# The literal here previously read 0.1.0 while the package said 0.1.0-dev.
version = { attr = "bayespinn_inv.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bayespinn_inv" = ["py.typed"]

# -----------------------------------------------------------------------------
# Test / lint / format
# -----------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "slow: integration tests that train networks (excluded from `make test`)",
]

[tool.coverage.run]
source = ["src/bayespinn_inv"]
omit = ["*/tests/*"]

[tool.ruff]
line-length = 96
# Deliberately BELOW the declared requires-python floor of 3.11. The tree is
# measured 3.9-clean by scripts/check_python_support_floor.py -- 110 files at
# generation 9, zero syntax rejections, zero post-3.9 stdlib or typing uses,
# zero runtime PEP 604 unions. Holding ruff at py39 keeps it that way, so the
# withdrawn 3.9 classifier can be restored by running one CI leg rather than
# by a port.
#
# The file count is stated because it grows and the guarantee does not. It was
# 96 at generation 7; the scan is static analysis and cannot see dependency
# resolution at the floor, so a larger clean scan is a larger unevidenced
# surface, not a stronger claim. See CI-01's cost statement, docs/G9_RESULT.md
# section 1.
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # line length handled by the formatter
    "E741",    # "I" is the standard symbol for current; "l"/"O" are not used
    "RUF001",  # unicode in docstrings (physics symbols) is intentional
    "RUF059",  # unpacked-but-unused is idiomatic for solver return tuples
    "C408",    # dict(...) reads better than {...} for config-like kwargs
    "E702",    # `a = 1; b = 2` for tightly-coupled scalar setup is idiomatic here
    "E731",    # short lambdas for local math helpers read better than def
]

[tool.ruff.lint.per-file-ignores]
# Experiment launchers prepend src/ to sys.path before importing the package.
"scripts/*" = ["E402"]

# ---------------------------------------------------------------------------
# The twelve notebooks are GENERATED ARTEFACTS, written by
# `scripts/build_notebooks.py`, and they ship with executed outputs (NB-01,
# `tests/test_notebooks.py::TestNotebooksHaveExecutedOutputs`). They are not
# hand-authored source, and they cannot be reformatted without regenerating,
# which discards the outputs that make them evidence.
#
# WHY THIS BLOCK EXISTS -- ruling of 2026-08-26 section 3, "fix it by
# elimination". The generation-8 baseline recorded `ruff_exit: 0` carrying
# neither scope nor invocation, and the two defensible scopes disagreed:
# `ruff check .` exited 1 with 107 findings, every one of them in
# `notebooks/`, while `ruff check src tests scripts` exited 0. One verdict
# was recorded and two existed. Annotating that ambiguity would have
# preserved it. This removes it: after this block both invocations exit 0
# over the tracked tree, and `tests/test_lint_scope_g9.py` asserts they agree
# and that the block is not a blanket amnesty.
#
# Four codes are layout consequences of how the generator emits cells:
#   I001  ruff lexes each cell as its own module, so the generator's
#         readability-ordered imports read as unsorted per cell
#   E401  `import numpy as np, torch, matplotlib.pyplot as plt` -- one setup
#         line is the notebook idiom
#   E402  a notebook imports where the narrative needs the import, which by
#         construction is not the top of a module
#   E701  `if s > 1e-9: zs.append(...)` -- compressed one-liners keep a
#         teaching cell on one screen
# Three are real untidiness in the generator's source strings, where the fix
# is a regeneration this repository will not do for a lint finding:
#   F401  one unused re-export, 01_setup cell 6
#   F541  `f"...%.1e..." % x`, 04_forward_surrogate cell 8 -- an f-string with
#         no placeholder followed by percent formatting; it prints correctly
#   B007  an unused loop counter, 05_inverse_design cell 6
# Those three are enumerated in `tests/test_lint_scope_g9.py` so that fixing
# the generator stays a visible action rather than a rediscovery.
#
# RUF100 is the mechanical consequence of the F401 line above, not a ninth
# judgement. The generator writes `import bayespinn_inv  # noqa: F401` into
# every setup cell -- a deliberate, correct annotation -- and disabling F401
# in these files makes all twelve of those directives unused, which is
# precisely what RUF100 reports. Silencing the rule and keeping its noqa is
# incoherent; the pair is listed together so the coupling is visible.
"notebooks/*.ipynb" = [
    # layout, from the generator
    "I001", "E401", "E402", "E701",
    # real untidiness in the generator source strings, enumerated in the guard
    "F401", "F541", "B007",
    # entailed by disabling F401 in files that carry `# noqa: F401`
    "RUF100",
]

[tool.black]
line-length = 96
target-version = ["py39"]

[tool.mypy]
# No `python_version` pin: current mypy refuses to target 3.9.
#
# The previous comment here claimed the 3.9 support claim was "backed by the CI
# matrix (which actually runs the suite on 3.9)". That was false in both halves:
# the CI matrix has never executed (CI-01, open since generation 0), so nothing
# has ever run the suite on 3.9. The claim it was defending has been withdrawn --
# see `requires-python` above and docs/gen/DECISIONS.md DEC-g7-2.
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
